{% extends "base.html" %}
{% block title %}<title>GapUp — IT Roles</title>{% endblock %}

{% block content %}
<section class="mb-6 border-b border-slate-800 pb-4">
  <h1 class="text-xl font-bold text-white">IT Roles Catalog</h1>
  <p class="text-xs text-slate-400 mt-1">Supported roles and required skill/certification counts.</p>
</section>

<section>
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
    {% for r in roles %}
    <div class="p-4 rounded-lg bg-slate-900 border border-slate-800 flex flex-col justify-between">
      <div>
        <h3 class="font-semibold text-slate-200 text-sm leading-snug">{{ r.name }}</h3>
      </div>
      <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 font-mono">
        <span>{{ r.skill_count }} Skills</span>
        <span>{{ r.cert_count }} Certs</span>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
