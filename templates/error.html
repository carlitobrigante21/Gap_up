{% extends "_base.html" %}
{% block title %}<title>GapUp — Error</title>{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 py-32 text-center">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-500/15 border border-red-500/30 text-red-400 mb-6">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" /></svg>
  </div>
  <h1 class="text-3xl font-extrabold">Something went wrong</h1>
  <p class="mt-3 text-slate-400">{{ message }}</p>
  <a href="/" class="mt-8 inline-flex items-center gap-2 px-5 py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-cyan-400 shadow-lg shadow-blue-600/30 transition-all hover:-translate-y-0.5">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 17l-5-5m0 0l5-5m-5 5h12" /></svg>
    Back to home
  </a>
</section>
{% endblock %}
