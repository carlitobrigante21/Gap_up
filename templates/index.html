{% extends "base.html" %}
{% block title %}<title>GapUp — Career Path Simulator</title>{% endblock %}

{% block content %}
<!-- Simulator Form Section -->
<section id="simulator" class="max-w-2xl mx-auto pt-6 pb-12">
  <form method="POST" action="/analyze" class="p-6 sm:p-8 rounded-lg bg-slate-900 border border-slate-800 shadow-sm">
    <h1 class="text-xl font-bold text-white mb-1">Career Transition Analysis</h1>
    <p class="text-xs text-slate-400 mb-6">Select your starting position and desired target position to compare skill requirements.</p>

    <div class="space-y-4">
      <div>
        <label for="current_role_id" class="block text-xs font-medium text-slate-300 mb-1.5">Current Role</label>
        <select id="current_role_id" name="current_role_id" required class="w-full bg-slate-950 border border-slate-700 rounded px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="" disabled selected>Select current role…</option>
          {% for r in roles %}
          <option value="{{ r.id }}">{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex justify-center py-1">
        <span class="text-slate-500 text-xs">↓</span>
      </div>

      <div>
        <label for="target_role_id" class="block text-xs font-medium text-slate-300 mb-1.5">Target Role</label>
        <select id="target_role_id" name="target_role_id" required class="w-full bg-slate-950 border border-slate-700 rounded px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="" disabled selected>Select target role…</option>
          {% for r in roles %}
          <option value="{{ r.id }}">{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button type="submit" class="mt-6 w-full px-4 py-2.5 rounded font-medium text-sm bg-blue-600 hover:bg-blue-500 text-white transition-colors">
      Calculate Transition Gap
    </button>
  </form>
</section>
{% endblock %}
